[project]
name = "context-budget-api"
version = "0.1.0"
description = "Check whether a conversation fits a model's context window, and trim it to fit."
readme = "README.md"
authors = [
    { name = "ahmadaliyu", email = "aliyuahmad1996@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Name our own packages so import grouping doesn't depend on whether a module
# exists yet (in TDD, tests import modules before they're written).
known-first-party = ["context_budget_api", "tests"]
